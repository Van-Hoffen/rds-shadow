; Пример. Боевые имена сюда не писать и этот файл не заполнять ими в git.
; Рабочую копию администратор кладёт рядом с программой или в ProgramData.

[connection]
; broker | servers
mode = broker
broker = broker.example.domain
rdp_port = 3389

[servers]
; Используется при mode = servers. Через запятую, FQDN.
list =

[groups]
; Пусто = кнопки нет. Не имена по умолчанию из кода.
view =
control =
logoff =

[audit]
log_dir = C:\ProgramData\rds-shadow\logs
; Необязательно. Пока пусто — только локальный файл.
share_dir =

[ui]
; auto | ru | en
language = auto
