name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        shell: pwsh
        run: |
          $name = "rds-shadow-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/rds-shadow.exe "dist/$name/"
          Copy-Item target/release/rds-shadow-cli.exe "dist/$name/"
          Copy-Item target/release/rds-shadow-audit.exe "dist/$name/"
          Copy-Item docs/architecture/rds-shadow.example.ini "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: rds-shadow-windows-x64
          path: dist/rds-shadow-windows-x64.zip

  publish:
    name: Publish GitHub Release
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          expected="v$version"
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag $tag does not match workspace version $version (expected $expected)"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/rds-shadow-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
