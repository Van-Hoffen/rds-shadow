name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release
      - name: Package
        shell: pwsh
        run: |
          $name = "rds-shadow-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/rds-shadow.exe "dist/$name/"
          Copy-Item target/release/rds-shadow-audit.exe "dist/$name/"
          Copy-Item docs/architecture/rds-shadow.example.ini "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rds-shadow-windows-x64
          path: dist/rds-shadow-windows-x64.zip

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build viewer
        run: cargo build --release -p rds-shadow-audit
      - name: Package
        run: |
          name="rds-shadow-audit-linux-x64"
          mkdir -p "dist/$name"
          cp target/release/rds-shadow-audit "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: rds-shadow-audit-linux-x64
          path: dist/rds-shadow-audit-linux-x64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          expected="v$version"
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag version=$version"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag $tag does not match workspace version $version (expected $expected)"
            exit 1
          fi

      - name: Lint and test
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rds-shadow-windows-x64.zip
            dist/rds-shadow-audit-linux-x64.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
